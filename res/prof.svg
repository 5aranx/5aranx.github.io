<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#07090b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9adf9e;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#68a7ff;stop-opacity:0.08" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="12" />
  <rect width="400" height="400" fill="url(#glow)" rx="12" />
  <!-- Grid lines for terminal vibe -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="#263236" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#263236" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="300" x2="400" y2="300" stroke="#263236" stroke-width="0.5" opacity="0.3"/>
  <!-- Terminal prompt -->
  <text x="30" y="60" font-family="'JetBrains Mono', monospace" font-size="13" fill="#7d8c86">saransh@192.88:~$</text>
  <text x="240" y="60" font-family="'JetBrains Mono', monospace" font-size="13" fill="#9adf9e" font-weight="bold">whoami</text>
  <!-- Output -->
  <text x="30" y="90" font-family="'JetBrains Mono', monospace" font-size="13" fill="#eef5f0">saransh</text>
  <text x="30" y="120" font-family="'JetBrains Mono', monospace" font-size="13" fill="#7d8c86">saransh@192.88:~$</text>
  <text x="240" y="120" font-family="'JetBrains Mono', monospace" font-size="13" fill="#9adf9e" font-weight="bold">cat /etc/passwd | grep saransh</text>
  <text x="30" y="150" font-family="'JetBrains Mono', monospace" font-size="12" fill="#eef5f0">saransh:x:1000:1000:Saransh Singh:/home/saransh:/bin/zsh</text>
  <!-- Prompt again -->
  <text x="30" y="190" font-family="'JetBrains Mono', monospace" font-size="13" fill="#7d8c86">saransh@192.88:~$</text>
  <text x="240" y="190" font-family="'JetBrains Mono', monospace" font-size="13" fill="#9adf9e" font-weight="bold">cat /etc/passwd</text>
  <!-- ASCII face from cat output style -->
  <text x="30" y="230" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c0ccc5">.  ┌───────────────────────────────┐</text>
  <text x="30" y="245" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c0ccc5">.  │                               │</text>
  <text x="30" y="260" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c0ccc5">.  │     ╱▔▔╲    ╱▔▔╲              │</text>
  <text x="30" y="275" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c0ccc5">.  │    ╱  ╲╲   ╱  ╲╲   ╱╲       │</text>
  <text x="30" y="290" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c0ccc5">.  │    ╲  ╱╱   ╲  ╱╱  ╱  ╲      │</text>
  <text x="30" y="305" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c0ccc5">.  │     ╲▁▁╱    ╲▁▁╱  ╱    ╲     │</text>
  <text x="30" y="320" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c0ccc5">.  │                   ╲    ╱     │</text>
  <text x="30" y="335" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c0ccc5">.  │                    ╲▁▁╱      │</text>
  <text x="30" y="350" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c0ccc5">.  │                               │</text>
  <text x="30" y="365" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c0ccc5">.  └───────────────────────────────┘</text>
  <!-- Blinking cursor dot -->
  <circle cx="275" cy="58" r="2" fill="#68a7ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
